packages:
    - manager
    - packages/config-core
    - packages/core
    - packages/example-ui
    - server
    - gate
    - packages/angular
    - packages/nextjs
    - packages/nuxt
    - examples/angular
    - examples/django
    - examples/fastify
    - examples/gate-private1-app
    - examples/gate-private2-static
    - examples/nextjs
    - examples/nuxt
    - examples/photos
    - tests/e2e

allowBuilds:
    '@parcel/watcher': false
    esbuild: true
    lmdb: false
    msgpackr-extract: false
    sharp: false
    workerd: true

minimumReleaseAgeExclude:
    - esbuild@0.28.1
    - nodemailer@10.0.16
    - sharp@0.35.5
    - '@types/node@25.9.1'
    - '@types/react@19.2.15'
    - postcss@8.5.15
    - tsx@4.22.3
    - '@playwright/test@1.61.0'
    - '@vitest/coverage-v8@4.1.9'
    - '@vitest/expect@4.1.9'
    - '@vitest/mocker@4.1.9'
    - '@vitest/pretty-format@4.1.9'
    - '@vitest/runner@4.1.9'
    - '@vitest/snapshot@4.1.9'
    - '@vitest/spy@4.1.9'
    - '@vitest/utils@4.1.9'
    - playwright-core@1.61.0
    - playwright@1.61.0
    - vitest@4.1.9

overrides:
    brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3'
    compression@<1.8.2: ^1.8.2
    defu@<=6.1.4: '>=6.1.5'
    esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
    fast-uri@>=3.0.0 <3.1.6: ^3.1.6
    fast-uri@>=4.0.0 <4.1.3: ^4.1.3
    lodash@<=4.17.23: '>=4.18.0'
    lodash@>=4.0.0 <=4.17.23: '>=4.18.0'
    listhen@1.10.1>node-forge: '-'
    miniflare>sharp: 0.35.5
    miniflare>undici: ^7.29.1
    next@>=16.0.0 <16.4.1: ^16.4.2
    next>postcss: ^8.5.15
    next>sharp: ^0.35.5
    nitropack@2.13.4>globby: '-'
    nitropack@2.13.5>globby: '-'
    nodemailer@<10.0.9: ^10.0.16
    qs@>=2.2.5 <6.16.0: ^6.16.0
    sharp@<0.35.5: ^0.35.5
    simple-git@<4.0.1: ^4.0.1
    svgo@>=4.0.0 <4.1.0: ^4.1.0
    undici@>=7.0.0 <7.29.1: ^7.29.1
    vite@>=7.0.0 <=7.3.1: '>=7.3.2'
    vite@>=7.1.0 <=7.3.1: '>=7.3.2'
    vite@>=8.0.0 <=8.1.5: '>=8.1.6'
    vite-node>vite: 8.3.4

patchedDependencies:
    '@nuxt/devtools@3.4.2': patches/@nuxt__devtools@3.4.2.patch
    listhen@1.10.1: patches/listhen@1.10.1.patch
    nitropack@2.13.4: patches/nitropack@2.13.4.patch
    nitropack@2.13.5: patches/nitropack@2.13.5.patch

packageExtensions:
    nitropack@2.13.4:
        dependencies:
            tinyglobby: ^0.2.17
    nitropack@2.13.5:
        dependencies:
            tinyglobby: ^0.2.17
    listhen@1.10.1:
        dependencies:
            selfsigned: ^5.5.0
